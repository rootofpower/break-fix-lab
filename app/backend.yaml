apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy: {}
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - image: ghcr.io/stefanprodan/podinfo:6.17.0
        name: podinfo
        env:
          - name: PODINFO_CACHE_SERVER
            value: tcp://redis:6379
        
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: backend
  name: backend
spec:
  ports:
  - name: 9898-9898
    port: 9898
    protocol: TCP
    targetPort: 9898
  selector:
    app: backend
  type: ClusterIP
status:
  loadBalancer: {}
